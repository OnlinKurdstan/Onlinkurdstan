<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئۆنلاین کوردستان</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            direction: rtl; 
            background: #f8f9fa; 
            color: #333; 
            padding-bottom: 70px; 
            min-height: 100vh;
        }
        
        .header { 
            background: linear-gradient(135deg, #dc3545, #e74c3c); 
            color: white; 
            padding: 1rem 0; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 1rem; 
        }
        
        .nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 1rem;
        }
        
        .logo { 
            font-size: 1.8rem; 
            font-weight: bold; 
            color: white; 
            text-decoration: none; 
            cursor: pointer;
        }
        
        .search-bar { 
            flex: 1; 
            max-width: 300px; 
            position: relative;
        }
        
        .search-input { 
            width: 100%; 
            padding: 0.8rem; 
            border: none; 
            border-radius: 25px; 
            font-size: 1rem;
            outline: none;
        }
        
        .btn { 
            padding: 0.7rem 1.5rem; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
            font-weight: 600;
            background: white; 
            color: #dc3545; 
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .banner { 
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4); 
            color: white; 
            text-align: center; 
            padding: 3rem 1rem; 
            margin: 2rem 0; 
            border-radius: 15px; 
        }
        
        .banner h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
        }
        
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 1.5rem; 
            margin: 2rem 0; 
        }
        
        .product-card { 
            background: white; 
            border-radius: 15px; 
            padding: 1.5rem; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            transition: transform 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
        }
        
        .product-icon { 
            font-size: 4rem; 
            margin: 1rem 0; 
        }
        
        .product-price { 
            color: #dc3545; 
            font-size: 1.3rem; 
            font-weight: bold; 
            margin: 1rem 0; 
        }
        
        .btn-cart {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 15px;
            cursor: pointer;
            margin: 0.3rem;
            transition: background 0.3s ease;
        }
        
        .btn-cart:hover {
            background: #c82333;
        }
        
        .btn-wishlist {
            background: white;
            color: #dc3545;
            border: 2px solid #dc3545;
            padding: 0.7rem;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            margin: 0.3rem;
        }
        
        .btn-wishlist:hover {
            background: #dc3545;
            color: white;
        }
        
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: white; 
            border-top: 1px solid #ddd; 
            display: flex; 
            height: 70px; 
            z-index: 1000; 
        }
        
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none; 
            color: #666; 
            font-size: 0.8rem; 
            flex: 1; 
            cursor: pointer;
        }
        
        .nav-item.active { 
            color: #dc3545; 
        }
        
        .nav-icon { 
            font-size: 1.3rem; 
            margin-bottom: 0.2rem; 
        }
        
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
            z-index: 2000; 
        }
        
        .modal-content { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; 
            padding: 2rem; 
            border-radius: 15px; 
            width: 90%; 
            max-width: 500px; 
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .close { 
            position: absolute; 
            top: 15px; 
            right: 20px; 
            font-size: 25px; 
            cursor: pointer; 
            color: #666;
        }
        
        .close:hover { 
            color: #dc3545; 
        }
        
        .input-field {
            width: 100%; 
            padding: 1rem; 
            margin: 0.5rem 0; 
            border: 2px solid #ddd; 
            border-radius: 10px;
            font-size: 1rem;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #dc3545;
        }
        
        .notification { 
            position: fixed; 
            top: 100px; 
            right: 20px; 
            background: #dc3545; 
            color: white; 
            padding: 1rem 1.5rem; 
            border-radius: 25px; 
            z-index: 9999; 
        }
        
        .category-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 1rem; 
        }
        
        .category-item { 
            text-align: center; 
            padding: 1.5rem; 
            border: 2px solid #ddd; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
        }
        
        .category-item:hover { 
            border-color: #dc3545; 
            background: #f8f9fa;
        }
        
        .cart-total {
            background: #dc3545;
            color: white;
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        .item-row {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 1rem; 
            border-bottom: 1px solid #eee; 
            margin-bottom: 0.5rem;
        }
        
        .remove-btn {
            background: #dc3545; 
            color: white; 
            border: none; 
            padding: 0.5rem 1rem; 
            border-radius: 10px; 
            cursor: pointer;
        }
        
        .checkout-btn {
            width: 100%; 
            background: #28a745; 
            color: white; 
            border: none; 
            padding: 1rem; 
            border-radius: 10px; 
            margin-top: 1rem; 
            font-size: 1rem; 
            cursor: pointer;
        }
        
        .register-link {
            text-align: center;
            margin-top: 1rem;
            color: #dc3545;
            cursor: pointer;
            text-decoration: underline;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #dc3545;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .logo { font-size: 1.5rem; }
            .banner h1 { font-size: 1.8rem; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
            .nav { flex-wrap: wrap; }
            .search-bar { order: 3; width: 100%; margin-top: 1rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div class="logo" onclick="handleLogoClick()">ئۆنلاین کوردستان</div>
                <div class="search-bar">
                    <input type="text" class="search-input" placeholder="گەڕان..." id="searchInput">
                </div>
                <div>
                    <span class="btn" onclick="showLoginModal()" id="loginBtn">چوونەژوور</span>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="banner">
            <h1>بەخێربێیت بۆ ئۆنلاین کوردستان</h1>
            <p>گەورەترین فرۆشگای ئەلیکترۆنی کوردستان</p>
        </div>

        <div class="products-grid" id="productsGrid"></div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="loadHome()">
            <div class="nav-icon">🏠</div>
            <div>خانە</div>
        </div>
        <div class="nav-item" onclick="showCategories()">
            <div class="nav-icon">📱</div>
            <div>دەستەبەندی</div>
        </div>
        <div class="nav-item" onclick="showCart()">
            <div class="nav-icon">🛒</div>
            <div>سەبەتە <span id="cartCount" style="background: #f5576c; color: white; border-radius: 50%; padding: 0.2rem 0.5rem; font-size: 0.7rem; display: none;"></span></div>
        </div>
        <div class="nav-item" onclick="showWishlist()">
            <div class="nav-icon">❤️</div>
            <div>دڵخواز</div>
        </div>
        <div class="nav-item" onclick="showProfile()">
            <div class="nav-icon">👤</div>
            <div>پرۆفایل</div>
        </div>
    </nav>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAha3geF3HCf60_FIdj2Vtu_T5J6jCcGg8",
            authDomain: "kurdistan-ecommerce.firebaseapp.com",
            projectId: "kurdistan-ecommerce",
            storageBucket: "kurdistan-ecommerce.firebasestorage.app",
            messagingSenderId: "660288701141",
            appId: "1:660288701141:web:e796002378e8f7656a985c"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Global variables
        let shoppingCart = [];
        let userWishlist = [];
        let loggedUser = null;
        let currentProducts = [];
        let adminClickCount = 0;
        let adminClickTimer = null;
        let orderHistory = [];
        const ADMIN_PASSWORD = "admin123";
        
        const productsList = [
            { id: 1, name: "مۆبایلی سامسۆنگ Galaxy S24", price: 800000, category: "mobile", icon: "📱" },
            { id: 2, name: "ئایفۆن 15 پرۆ", price: 1200000, category: "mobile", icon: "📱" },
            { id: 3, name: "سەرویسی پختوپەز", price: 180000, category: "home", icon: "🍳" },
            { id: 4, name: "قابلمەی کاسرۆڵ", price: 75000, category: "home", icon: "🥘" },
            { id: 5, name: "زوودەزی فیلیپس", price: 95000, category: "home", icon: "⚡" },
            { id: 6, name: "هێدفۆنی سۆنی", price: 120000, category: "electronics", icon: "🎧" }
        ];

        let categories = [
            { id: 'mobile', name: 'مۆبایل', icon: '📱' },
            { id: 'home', name: 'خانە و آشپزخانە', icon: '🍳' },
            { id: 'electronics', name: 'ئەلیکترۆنیات', icon: '💻' },
            { id: 'accessories', name: 'ئیکسسواراتی سەیارە', icon: '🔌' }
        ];

        // Firebase functions
        async function saveUserCart(userId, cart) {
            try {
                await setDoc(doc(db, 'userCarts', userId), { cart: cart });
            } catch (error) {
                console.error('Error saving cart:', error);
            }
        }

        async function loadUserCart(userId) {
            try {
                const cartDoc = await getDocs(collection(db, 'userCarts'));
                cartDoc.forEach((doc) => {
                    if (doc.id === userId && doc.data().cart) {
                        shoppingCart = doc.data().cart;
                        updateCartCounter();
                    }
                });
            } catch (error) {
                console.error('Error loading cart:', error);
            }
        }

        async function saveOrder(orderData) {
            try {
                await addDoc(collection(db, 'orders'), orderData);
                await loadOrders(); // Refresh orders
            } catch (error) {
                console.error('Error saving order:', error);
                showAlert('خەطا لە پاشەکەوتکردنی داواکاری');
            }
        }

        async function loadOrders() {
            try {
                const ordersSnapshot = await getDocs(collection(db, 'orders'));
                orderHistory = [];
                ordersSnapshot.forEach((doc) => {
                    orderHistory.push({ id: doc.id, ...doc.data() });
                });
            } catch (error) {
                console.error('Error loading orders:', error);
            }
        }

        // Auth state observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loggedUser = {
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName || user.email.split('@')[0]
                };
                document.getElementById('loginBtn').textContent = loggedUser.name;
                loadUserCart(user.uid);
            } else {
                loggedUser = null;
                document.getElementById('loginBtn').textContent = 'چوونەژوور';
                shoppingCart = [];
                userWishlist = [];
                updateCartCounter();
            }
        });

        // Main functions
        function handleLogoClick() {
            adminClickCount++;
            
            if (adminClickTimer) {
                clearTimeout(adminClickTimer);
            }
            
            if (adminClickCount === 3) {
                showAdminLogin();
                adminClickCount = 0;
                return;
            }
            
            adminClickTimer = setTimeout(() => {
                if (adminClickCount < 3) {
                    loadHome();
                }
                adminClickCount = 0;
            }, 1000);
        }

        function loadHome() {
            setNavActive(0);
            currentProducts = [...productsList];
            renderProducts();
            document.getElementById('searchInput').value = '';
        }

        function renderProducts(products = currentProducts) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 2rem; grid-column: 1 / -1;"><h3>هیچ بەرهەمێک نەدۆزرایەوە</h3></div>';
                return;
            }
            
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-icon">${product.icon}</div>
                    <h3>${product.name}</h3>
                    <div class="product-price">${product.price.toLocaleString()} دینار</div>
                    <div>
                        <button class="btn-cart" onclick="addToCart(${product.id})">زیادکردن بۆ سەبەتە</button>
                        <button class="btn-wishlist" onclick="addToWishlist(${product.id})">❤️</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function showCategories() {
            setNavActive(1);
            const categoryItems = categories.map(cat => `
                <div class="category-item" onclick="filterByCategory('${cat.id}'); closeModal();">
                    <div style="font-size: 3rem;">${cat.icon}</div>
                    <div>${cat.name}</div>
                </div>
            `).join('');
            
            const content = `
                <div class="category-grid">
                    <div class="category-item" onclick="filterByCategory('all'); closeModal();">
                        <div style="font-size: 3rem;">🏠</div>
                        <div>هەموو بەرهەمەکان</div>
                    </div>
                    ${categoryItems}
                </div>
            `;
            openModal('دەستەبەندیەکان', content);
        }

        function showCart() {
            setNavActive(2);
            let content;
            if (shoppingCart.length === 0) {
                content = '<div style="text-align: center; padding: 2rem;"><h3>سەبەتەکەت بەتاڵە</h3></div>';
            } else {
                const items = shoppingCart.map(item => `
                    <div class="item-row">
                        <div>
                            <strong>${item.name}</strong><br>
                            <span style="color: #dc3545;">${item.price.toLocaleString()} دینار</span>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${item.id}); showCart();">سڕینەوە</button>
                    </div>
                `).join('');
                
                const total = shoppingCart.reduce((sum, item) => sum + item.price, 0);
                content = items + `
                    <div class="cart-total">کۆی گشتی: ${total.toLocaleString()} دینار</div>
                    <button class="checkout-btn" onclick="processCheckout()">تەواوکردنی کڕین</button>
                `;
            }
            openModal('سەبەتەی کڕین', content);
        }

        function showWishlist() {
            setNavActive(3);
            let content;
            if (userWishlist.length === 0) {
                content = '<div style="text-align: center; padding: 2rem;"><h3>لیستی دڵخوازەکانت بەتاڵە</h3></div>';
            } else {
                content = userWishlist.map(item => `
                    <div class="item-row">
                        <div>
                            <strong>${item.name}</strong><br>
                            <span style="color: #dc3545;">${item.price.toLocaleString()} دینار</span>
                        </div>
                        <div>
                            <button class="btn-cart" onclick="addToCart(${item.id})" style="margin-left: 0.5rem;">زیادکردن</button>
                            <button class="remove-btn" onclick="removeFromWishlist(${item.id}); showWishlist();">سڕینەوە</button>
                        </div>
                    </div>
                `).join('');
            }
            openModal('لیستی دڵخوازەکان', content);
        }

        function showProfile() {
            setNavActive(4);
            if (loggedUser) {
                const content = `
                    <div style="text-align: center;">
                        <div style="width: 80px; height: 80px; background: #dc3545; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 2rem; color: white;">👤</div>
                        <h3>${loggedUser.name}</h3>
                        <p style="color: #666; margin: 0.5rem 0;">ئیمەیل: ${loggedUser.email}</p>
                        <button class="remove-btn" onclick="userLogout(); closeModal();" style="width: 100%;">چوونەدەرەوە</button>
                    </div>
                `;
                openModal('پرۆفایل', content);
            } else {
                showLoginModal();
            }
        }

        function showLoginModal() {
            const content = `
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <h3>چوونەژوور</h3>
                </div>
                <input type="email" class="input-field" placeholder="ئیمەیل" id="loginEmail" required>
                <input type="password" class="input-field" placeholder="تێپەڕوشە" id="loginPassword" required>
                <button class="checkout-btn" onclick="performLogin()">چوونەژوور</button>
                <div class="register-link" onclick="showRegisterModal()">ئەکاونتت نییە؟ تۆمارکردن</div>
            `;
            openModal('چوونەژوور', content);
        }

        function showRegisterModal() {
            const content = `
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <h3>تۆمارکردنی ئەکاونتی نوێ</h3>
                </div>
                <input type="text" class="input-field" placeholder="ناوی تەواو" id="regName" required>
                <input type="email" class="input-field" placeholder="ئیمەیل" id="regEmail" required>
                <input type="password" class="input-field" placeholder="تێپەڕوشە" id="regPassword" required>
                <input type="password" class="input-field" placeholder="دووبارەکردنەوەی تێپەڕوشە" id="regConfirm" required>
                <button class="checkout-btn" onclick="performRegister()">تۆمارکردن</button>
                <div class="register-link" onclick="showLoginModal()">ئەکاونتت هەیە؟ چوونەژوور</div>
            `;
            openModal('تۆمارکردن', content);
        }

        async function performLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            if (!email || !password) {
                showAlert('تکایە هەموو خانەکان پڕبکەرەوە');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                closeModal();
                showAlert('بە سەرکەوتووی چوویتەژوورەوە');
            } catch (error) {
                showAlert('ئیمەیل یان پاسوردەکە هەڵەیە');
            }
        }

        async function performRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const confirm = document.getElementById('regConfirm').value.trim();
            
            if (!name || !email || !password || !confirm) {
                showAlert('تکایە هەموو خانەکان پڕبکەرەوە');
                return;
            }

            if (password !== confirm) {
                showAlert('تێپەڕوشەکان یەکسان نین');
                return;
            }

            if (password.length < 6) {
                showAlert('تێپەڕوشە دەبێت لانیکەم ٦ پیت بێت');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                closeModal();
                showAlert(`ئەکاونتەکەت دروستکرا، بەخێربێیت!`);
            } catch (error) {
                showAlert('خەطا لە دروستکردنی ئەکاونت: ' + error.message);
            }
        }

        async function userLogout() {
            try {
                await signOut(auth);
                showAlert('بە سەرکەوتووی چوویتە دەرەوە');
            } catch (error) {
                showAlert('خەطا لە چوونەدەرەوە');
            }
        }

        function showAdminLogin() {
            const content = `
                <div style="text-align: center; margin-bottom: 2rem;">
                    <h3 style="color: #dc3545;">🔒 چوونەژوورەوەی بەڕیوبەر</h3>
                    <p style="color: #666; margin-top: 0.5rem;">تکایە پاسوردی بەڕیوبەر بنووسە</p>
                </div>
                <input type="password" class="input-field" placeholder="پاسوردی بەڕیوبەر" id="adminPassword" required>
                <button class="btn-cart" onclick="verifyAdminLogin()" style="width: 100%; margin-top: 1rem;">چوونەژوور</button>
            `;
            openModal('چوونەژوورەوەی بەڕیوبەر', content);
        }

        async function verifyAdminLogin() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                await loadOrders(); // Load orders first
                closeModal();
                showAdminPanel();
                showAlert('بەخێربێیت بۆ پانێڵی بەڕیوبەر');
            } else {
                showAlert('پاسوردەکە هەڵەیە');
            }
        }

        function showAdminPanel() {
            const content = `
                <div style="text-align: center; margin-bottom: 2rem;">
                    <h3 style="color: #dc3545;">پانێڵی بەڕیوبەر</h3>
                </div>
                <div style="display: grid; gap: 1rem;">
                    <button class="btn-cart" onclick="showOrdersManager()" style="width: 100%;">بەڕیوبردنی داواکاریەکان</button>
                    <button class="btn-cart" onclick="showSalesReport()" style="width: 100%;">ڕاپۆرتی فرۆشتن</button>
                    <button class="btn-cart" onclick="showProductManager()" style="width: 100%;">بەڕیوبردنی بەرهەمەکان</button>
                    <button class="btn-cart" onclick="showCategoryManager()" style="width: 100%;">بەڕیوبردنی دەستەبەندیەکان</button>
                    <button class="remove-btn" onclick="clearAllData()" style="width: 100%;">پاککردنەوەی هەموو داتاکان</button>
                </div>
            `;
            openModal('پانێڵی بەڕیوبەر', content);
        }

        function showOrdersManager() {
            const content = `
                <div>
                    <h4 style="text-align: center; margin-bottom: 1rem;">بەڕیوبردنی داواکاریەکان</h4>
                    ${orderHistory.length === 0 ? 
                        '<div style="text-align: center; padding: 2rem; color: #666;"><p>هیچ داواکاریەکی کڕین نییە لە ئێستادا</p></div>' 
                        : 
                        `<div style="max-height: 400px; overflow-y: auto;">
                            ${orderHistory.map(order => `
                                <div style="background: #f8f9fa; padding: 1rem; border-radius: 10px; margin-bottom: 1rem; border-left: 4px solid #dc3545;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                        <strong>داواکاری #${order.orderId}</strong>
                                        <span style="background: #28a745; color: white; padding: 0.2rem 0.8rem; border-radius: 15px; font-size: 0.8rem;">${order.status}</span>
                                    </div>
                                    <p><strong>کڕیار:</strong> ${order.customerName}</p>
                                    <p><strong>ئیمەیل:</strong> ${order.customerEmail}</p>
                                    <p><strong>ناونیشان:</strong> ${order.address}</p>
                                    <p><strong>کۆی گشتی:</strong> ${order.total.toLocaleString()} دینار</p>
                                    <p><strong>شێوازی پارەدان:</strong> ${order.paymentMethod}</p>
                                    <p><strong>بەروار:</strong> ${new Date(order.timestamp.seconds * 1000).toLocaleDateString('ku')}</p>
                                    <div style="margin-top: 0.5rem;">
                                        <strong>بەرهەمەکان:</strong>
                                        <ul style="margin: 0.5rem 0; padding-right: 1rem;">
                                            ${order.items.map(item => `<li>${item.name} - ${item.price.toLocaleString()} دینار</li>`).join('')}
                                        </ul>
                                    </div>
                                    ${order.notes ? `<p><strong>تێبینی:</strong> ${order.notes}</p>` : ''}
                                </div>
                            `).join('')}
                        </div>`
                    }
                    <button class="btn-cart" onclick="showAdminPanel()" style="width: 100%; margin-top: 1rem;">گەڕانەوە</button>
                </div>
            `;
            openModal('بەڕیوبردنی داواکاریەکان', content);
        }

        function showSalesReport() {
            const totalProducts = productsList.length;
            const cartItems = shoppingCart.length;
            const wishlistItems = userWishlist.length;
            const totalOrders = orderHistory.length;
            const totalRevenue = orderHistory.reduce((sum, order) => sum + order.total, 0);
            
            const content = `
                <div style="text-align: center;">
                    <h4>ڕاپۆرتی فرۆشتن</h4>
                    <div style="background: #f8f9fa; padding: 1rem; border-radius: 10px; margin: 1rem 0;">
                        <p><strong>کۆی بەرهەمەکان:</strong> ${totalProducts}</p>
                        <p><strong>کۆی داواکاریەکان:</strong> ${totalOrders}</p>
                        <p><strong>کۆی داهاتەکان:</strong> ${totalRevenue.toLocaleString()} دینار</p>
                        <p><strong>بەکارهێنەری ئەکتیڤ:</strong> ${loggedUser ? 1 : 0}</p>
                        <p><strong>بەرهەم لە سەبەتەدا:</strong> ${cartItems}</p>
                        <p><strong>بەرهەم لە لیستی دڵخوازەکاندا:</strong> ${wishlistItems}</p>
                    </div>
                    <button class="btn-cart" onclick="showAdminPanel()" style="width: 100%;">گەڕانەوە</button>
                </div>
            `;
            openModal('ڕاپۆرتی فرۆشتن', content);
        }

        async function addToCart(productId) {
            const product = productsList.find(p => p.id === productId);
            if (product && !shoppingCart.find(c => c.id === productId)) {
                shoppingCart.push(product);
                updateCartCounter();
                
                if (loggedUser) {
                    await saveUserCart(loggedUser.uid, shoppingCart);
                }
                
                showAlert(`${product.name} زیادکرا بۆ سەبەتە`);
            } else if (shoppingCart.find(c => c.id === productId)) {
                showAlert('ئەم بەرهەمە پێشتر زیادکراوە');
            }
        }

        function addToWishlist(productId) {
            const product = productsList.find(p => p.id === productId);
            if (product && !userWishlist.find(w => w.id === productId)) {
                userWishlist.push(product);
                showAlert(`${product.name} زیادکرا بۆ لیستی دڵخوازەکان`);
            } else if (userWishlist.find(w => w.id === productId)) {
                showAlert('ئەم بەرهەمە پێشتر زیادکراوە');
            }
        }

        async function removeFromCart(productId) {
            shoppingCart = shoppingCart.filter(c => c.id !== productId);
            updateCartCounter();
            
            if (loggedUser) {
                await saveUserCart(loggedUser.uid, shoppingCart);
            }
            
            showAlert('بەرهەم سڕایەوە لە سەبەتە');
        }

        function removeFromWishlist(productId) {
            userWishlist = userWishlist.filter(w => w.id !== productId);
            showAlert('بەرهەم سڕایەوە لە لیستی دڵخوازەکان');
        }

        function filterByCategory(category) {
            if (category === 'all') {
                currentProducts = [...productsList];
            } else {
                currentProducts = productsList.filter(p => p.category === category);
            }
            renderProducts();
        }

        function processCheckout() {
            if (shoppingCart.length === 0) {
                showAlert('سەبەتەکەت بەتاڵە');
                return;
            }

            if (!loggedUser) {
                showAlert('تکایە سەرەتا چوونەژوور بکە');
                closeModal();
                showLoginModal();
                return;
            }

            const total = shoppingCart.reduce((sum, item) => sum + item.price, 0);
            const content = `
                <div>
                    <h4 style="text-align: center; margin-bottom: 1.5rem; color: #dc3545;">تەواوکردنی کڕین</h4>
                    
                    <div style="background: #f8f9fa; padding: 1rem; border-radius: 10px; margin-bottom: 1rem;">
                        <h5 style="color: #333; margin-bottom: 0.5rem;">زانیاریی کڕیار:</h5>
                        <p><strong>ناو:</strong> ${loggedUser.name}</p>
                        <p><strong>ئیمەیل:</strong> ${loggedUser.email}</p>
                    </div>
                    
                    <div style="background: #fff; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 1rem;">
                        <h5 style="background: #dc3545; color: white; padding: 0.8rem; margin: 0; border-radius: 10px 10px 0 0;">بەرهەمەکانی داواکراو:</h5>
                        <div style="padding: 1rem;">
                            ${shoppingCart.map((item, index) => `
                                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; ${index < shoppingCart.length - 1 ? 'border-bottom: 1px solid #eee;' : ''}">
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <span style="font-size: 1.5rem;">${item.icon}</span>
                                        <div>
                                            <div style="font-weight: bold;">${item.name}</div>
                                            <div style="font-size: 0.9rem; color: #666;">دانە: ١</div>
                                        </div>
                                    </div>
                                    <div style="text-align: left; color: #dc3545; font-weight: bold;">
                                        ${item.price.toLocaleString()} دینار
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div style="background: #dc3545; color: white; padding: 1rem; border-radius: 10px; margin-bottom: 1rem;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span>کۆی بەرهەمەکان:</span>
                            <span>${shoppingCart.length} دانە</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span>کۆی نرخ:</span>
                            <span>${total.toLocaleString()} دینار</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span>کرێی گەیاندن:</span>
                            <span>بەخۆڕایی</span>
                        </div>
                        <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.3); margin: 0.5rem 0;">
                        <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold;">
                            <span>کۆی گشتی:</span>
                            <span>${total.toLocaleString()} دینار</span>
                        </div>
                    </div>
                    
                    <div style="background: #e9ecef; padding: 1rem; border-radius: 10px; margin-bottom: 1rem;">
                        <h5 style="color: #333; margin-bottom: 0.5rem;">زانیاریی گەیاندن:</h5>
                        <input type="text" class="input-field" placeholder="ناونیشانی تەواو" id="deliveryAddress" required style="margin-bottom: 0.5rem;">
                        <textarea class="input-field" placeholder="تێبینی بۆ گەیاندن" id="deliveryNotes" rows="2"></textarea>
                    </div>
                    
                    <div style="display: grid; gap: 0.5rem;">
                        <button class="checkout-btn" onclick="finalizeOrder('cash')" style="background: #28a745;">پارەدانی کاتی گەیاندن</button>
                        <button class="checkout-btn" onclick="finalizeOrder('card')" style="background: #007bff;">پارەدانی ئۆنلاین</button>
                    </div>
                </div>
            `;
            openModal('تەواوکردنی کڕین', content);
        }

        async function finalizeOrder(paymentMethod) {
            const address = document.getElementById('deliveryAddress').value.trim();
            const notes = document.getElementById('deliveryNotes').value.trim();
            
            if (!address) {
                showAlert('تکایە ناونیشانی گەیاندن بنووسە');
                return;
            }
            
            const total = shoppingCart.reduce((sum, item) => sum + item.price, 0);
            const paymentText = paymentMethod === 'cash' ? 'پارەدانی کاتی گەیاندن' : 'پارەدانی ئۆنلاین';
            
            const order = {
                orderId: Date.now(),
                customerName: loggedUser.name,
                customerEmail: loggedUser.email,
                customerUid: loggedUser.uid,
                items: [...shoppingCart],
                total: total,
                address: address,
                notes: notes,
                paymentMethod: paymentText,
                timestamp: new Date(),
                status: 'نوێ'
            };
            
            try {
                await saveOrder(order);
                shoppingCart = [];
                updateCartCounter();
                
                if (loggedUser) {
                    await saveUserCart(loggedUser.uid, shoppingCart);
                }
                
                closeModal();
                showAlert(`داواکاری کڕینەکەت بە سەرکەوتووی نێردرا! ژمارەی داواکاری: ${order.orderId}`);
            } catch (error) {
                showAlert('خەطا لە ناردنی داواکاری');
            }
        }

        function updateCartCounter() {
            const counter = document.getElementById('cartCount');
            if (shoppingCart.length > 0) {
                counter.textContent = shoppingCart.length;
                counter.style.display = 'inline';
            } else {
                counter.style.display = 'none';
            }
        }

        function setNavActive(index) {
            document.querySelectorAll('.nav-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        function openModal(title, content) {
            closeModal();
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.style.display = 'block';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close" onclick="closeModal()">&times;</span>
                    <h2 style="text-align: center; margin-bottom: 1rem;">${title}</h2>
                    <div>${content}</div>
                </div>
            `;
            document.body.appendChild(modal);
            
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            });
        }

        function closeModal() {
            const modal = document.querySelector('.modal');
            if (modal) modal.remove();
        }

        function showAlert(message) {
            const existingAlert = document.querySelector('.notification');
            if (existingAlert) existingAlert.remove();
            
            const alert = document.createElement('div');
            alert.className = 'notification';
            alert.textContent = message;
            document.body.appendChild(alert);
            
            setTimeout(() => {
                if (alert.parentNode) {
                    alert.remove();
                }
            }, 4000);
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchTerm = this.value.toLowerCase().trim();
            if (searchTerm === '') {
                currentProducts = [...productsList];
            } else {
                currentProducts = productsList.filter(product => 
                    product.name.toLowerCase().includes(searchTerm)
                );
            }
            renderProducts();
        });

        // Make functions global for onclick handlers
        window.handleLogoClick = handleLogoClick;
        window.loadHome = loadHome;
        window.showCategories = showCategories;
        window.showCart = showCart;
        window.showWishlist = showWishlist;
        window.showProfile = showProfile;
        window.showLoginModal = showLoginModal;
        window.showRegisterModal = showRegisterModal;
        window.performLogin = performLogin;
        window.performRegister = performRegister;
        window.userLogout = userLogout;
        window.addToCart = addToCart;
        window.addToWishlist = addToWishlist;
        window.removeFromCart = removeFromCart;
        window.removeFromWishlist = removeFromWishlist;
        window.filterByCategory = filterByCategory;
        window.processCheckout = processCheckout;
        window.finalizeOrder = finalizeOrder;
        window.closeModal = closeModal;
        window.verifyAdminLogin = verifyAdminLogin;
        window.showAdminPanel = showAdminPanel;
        window.showOrdersManager = showOrdersManager;
        window.showSalesReport = showSalesReport;

        // Initialize
        currentProducts = [...productsList];
        renderProducts();
        updateCartCounter();
    </script>
</body>
</html>
