<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئۆنلاین کوردستان</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; direction: rtl; background: #f8f9fa; color: #333; padding-bottom: 70px; }
        .header { background: linear-gradient(135deg, #dc3545, #e74c3c); color: white; padding: 1rem 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        .nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 2rem; font-weight: bold; color: white; text-decoration: none; }
        .search-bar { flex: 1; max-width: 400px; margin: 0 1rem; }
        .search-input { width: 100%; padding: 0.8rem; border: none; border-radius: 25px; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 20px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: white; color: #dc3545; }
        .banner { background: linear-gradient(45deg, #ff6b6b, #4ecdc4); color: white; text-align: center; padding: 3rem 0; margin: 2rem 0; border-radius: 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        .product-card { background: white; border-radius: 15px; padding: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .product-icon { font-size: 4rem; margin: 1rem 0; }
        .product-price { color: #dc3545; font-size: 1.2rem; font-weight: bold; margin: 0.5rem 0; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; height: 60px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #666; font-size: 0.7rem; flex: 1; }
        .nav-item.active { color: #dc3545; }
        .nav-icon { font-size: 1.2rem; margin-bottom: 0.2rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 2rem; border-radius: 15px; width: 90%; max-width: 500px; }
        .close { position: absolute; top: 10px; right: 15px; font-size: 30px; cursor: pointer; }
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .category-item { text-align: center; padding: 1.5rem; border: 2px solid #ddd; border-radius: 15px; cursor: pointer; transition: all 0.3s; }
        .category-item:hover { border-color: #dc3545; transform: translateY(-3px); }
        .notification { position: fixed; top: 100px; right: 20px; background: #dc3545; color: white; padding: 1rem 2rem; border-radius: 25px; z-index: 9999; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="#" class="logo" onclick="goHome()">ئۆنلاین کوردستان</a>
                <div class="search-bar">
                    <input type="text" class="search-input" placeholder="گەڕان..." id="searchInput">
                </div>
                <div>
                    <a href="#" class="btn btn-primary" onclick="showLogin()">چوونەژوور</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="banner">
            <h1>بەخێربێیت بۆ ئۆنلاین کوردستان</h1>
            <p>گەورەترین فرۆشگای ئەلیکترۆنی کوردستان</p>
        </div>

        <div class="products-grid" id="productsGrid"></div>
    </main>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="goHome()">
            <div class="nav-icon">🏠</div>
            <div>خانە</div>
        </a>
        <a href="#" class="nav-item" onclick="showCategories()">
            <div class="nav-icon">📱</div>
            <div>دەستەبەندی</div>
        </a>
        <a href="#" class="nav-item" onclick="showCart()">
            <div class="nav-icon">🛒</div>
            <div>سەبەتە</div>
        </a>
        <a href="#" class="nav-item" onclick="showWishlist()">
            <div class="nav-icon">❤️</div>
            <div>دڵخواز</div>
        </a>
        <a href="#" class="nav-item" onclick="showProfile()">
            <div class="nav-icon">👤</div>
            <div>پرۆفایل</div>
        </a>
    </nav>

    <script>
        const products = [
            { id: 1, name: "مۆبایلی سامسۆنگ Galaxy S24", price: 800000, category: "mobile", icon: "📱" },
            { id: 2, name: "ئایفۆن 15 پرۆ", price: 1200000, category: "mobile", icon: "📱" },
            { id: 3, name: "سەرویسی پختوپەز", price: 180000, category: "home", icon: "🍳" },
            { id: 4, name: "قابلمەی کاسرۆڵ", price: 75000, category: "home", icon: "🥘" },
            { id: 5, name: "زوودەزی فیلیپس", price: 95000, category: "home", icon: "⚡" },
            { id: 6, name: "هێدفۆنی سۆنی", price: 120000, category: "electronics", icon: "🎧" }
        ];

        let cart = [];
        let wishlist = [];
        let currentUser = null;

        function displayProducts(productsToShow = products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            productsToShow.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-icon">${product.icon}</div>
                    <h3>${product.name}</h3>
                    <div class="product-price">${product.price.toLocaleString()} دینار</div>
                    <button class="btn btn-primary" onclick="addToCart(${product.id})">زیادکردن بۆ سەبەتە</button>
                    <button class="btn" onclick="addToWishlist(${product.id})" style="margin-right: 0.5rem; background: #f8f9fa; color: #dc3545;">❤️</button>
                `;
                grid.appendChild(card);
            });
        }

        function goHome() {
            setActiveNav(0);
            displayProducts();
        }

        function showCategories() {
            setActiveNav(1);
            const content = `
                <div class="category-grid">
                    <div class="category-item" onclick="filterCategory('all'); closeModal('categoriesModal');">
                        <div style="font-size: 3rem; margin-bottom: 0.5rem;">🏠</div>
                        <div>هەموو بەرهەمەکان</div>
                    </div>
                    <div class="category-item" onclick="filterCategory('mobile'); closeModal('categoriesModal');">
                        <div style="font-size: 3rem; margin-bottom: 0.5rem;">📱</div>
                        <div>مۆبایل</div>
                    </div>
                    <div class="category-item" onclick="filterCategory('home'); closeModal('categoriesModal');">
                        <div style="font-size: 3rem; margin-bottom: 0.5rem;">🍳</div>
                        <div>خانە و آشپزخانە</div>
                    </div>
                    <div class="category-item" onclick="filterCategory('electronics'); closeModal('categoriesModal');">
                        <div style="font-size: 3rem; margin-bottom: 0.5rem;">💻</div>
                        <div>ئەلیکترۆنیات</div>
                    </div>
                </div>
            `;
            createModal('categoriesModal', 'دەستەبەندیەکان', content);
        }

        function showCart() {
            setActiveNav(2);
            const content = cart.length === 0 ? 
                '<div style="text-align: center; padding: 2rem;">سەبەتەکەت بەتاڵە</div>' :
                cart.map(item => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #eee;">
                        <div>
                            <strong>${item.name}</strong><br>
                            <span style="color: #dc3545;">${item.price.toLocaleString()} دینار</span>
                        </div>
                        <button onclick="removeFromCart(${item.id}); showCart();" style="background: #dc3545; color: white; border: none; padding: 0.5rem; border-radius: 5px;">سڕینەوە</button>
                    </div>
                `).join('');
            createModal('cartModal', 'سەبەتەی کڕین', content);
        }

        function showWishlist() {
            setActiveNav(3);
            const content = wishlist.length === 0 ?
                '<div style="text-align: center; padding: 2rem;">هیچ بەرهەمێک لە لیستی دڵخوازەکاندا نییە</div>' :
                wishlist.map(item => `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #eee;">
                        <div>
                            <strong>${item.name}</strong><br>
                            <span style="color: #dc3545;">${item.price.toLocaleString()} دینار</span>
                        </div>
                        <button onclick="removeFromWishlist(${item.id}); showWishlist();" style="background: #dc3545; color: white; border: none; padding: 0.5rem; border-radius: 5px;">سڕینەوە</button>
                    </div>
                `).join('');
            createModal('wishlistModal', 'لیستی دڵخوازەکان', content);
        }

        function showProfile() {
            setActiveNav(4);
            if (currentUser) {
                const content = `
                    <div style="text-align: center;">
                        <div style="width: 80px; height: 80px; background: #dc3545; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 2rem; color: white;">👤</div>
                        <h3>${currentUser.name}</h3>
                        <button onclick="logout(); closeModal('profileModal');" class="btn btn-primary" style="margin-top: 1rem;">چوونەدەرەوە</button>
                    </div>
                `;
                createModal('profileModal', 'پرۆفایل', content);
            } else {
                showLogin();
            }
        }

        function showLogin() {
            const content = `
                <input type="text" placeholder="ناو" id="loginName" style="width: 100%; padding: 0.8rem; margin: 0.5rem 0; border: 1px solid #ddd; border-radius: 5px;">
                <button onclick="login()" class="btn btn-primary" style="width: 100%;">چوونەژوور</button>
            `;
            createModal('loginModal', 'چوونەژوور', content);
        }

        function login() {
            const name = document.getElementById('loginName').value;
            if (name) {
                currentUser = { name };
                closeModal('loginModal');
                showNotification(`بەخێربێیتەوە ${name}!`);
            }
        }

        function logout() {
            currentUser = null;
            showNotification('بە سەرکەوتووی چوویتە دەرەوە');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product && !cart.find(c => c.id === productId)) {
                cart.push(product);
                showNotification('بەرهەم زیادکرا بۆ سەبەتە');
            }
        }

        function addToWishlist(productId) {
            const product = products.find(p => p.id === productId);
            if (product && !wishlist.find(w => w.id === productId)) {
                wishlist.push(product);
                showNotification('بەرهەم زیادکرا بۆ لیستی دڵخوازەکان');
            }
        }

        function removeFromCart(productId) {
            cart = cart.filter(c => c.id !== productId);
        }

        function removeFromWishlist(productId) {
            wishlist = wishlist.filter(w => w.id !== productId);
        }

        function filterCategory(category) {
            if (category === 'all') {
                displayProducts();
            } else {
                displayProducts(products.filter(p => p.category === category));
            }
            showNotification(`دەستەبەندی ${category} نیشاندرا`);
        }

        function setActiveNav(index) {
            document.querySelectorAll('.nav-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        function createModal(id, title, content) {
            closeModal(id);
            const modal = document.createElement('div');
            modal.id = id;
            modal.className = 'modal';
            modal.style.display = 'block';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close" onclick="closeModal('${id}')">&times;</span>
                    <h2>${title}</h2>
                    <div>${content}</div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.remove();
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Initialize
        displayProducts();
    </script>
</body>
</html>
